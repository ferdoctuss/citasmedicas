<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.M.I. "Santa Celia" - Historial Clínico</title>

    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --primary-bg: #e3f2fd;
            --text-color: #333333;
            --page-bg: #f4f7f6;
            --border-color: #ced4da;
            --readonly-bg: #e9ecef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* === PANTALLA DE LOGIN === */
        .login-box {
            max-width: 350px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .menu-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            text-align: center;
            background-color: var(--primary-color);
            transition: background 0.2s;
        }
        .menu-btn:hover { background-color: var(--primary-dark); }

        /* === DASHBOARD === */
        #dashboard { display: none; width: 100%; }

        .title-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .brand h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .area-select-header {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--primary-color);
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .action-btn {
            background: #d90429;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* FORMULARIO CLINICO */
        .card-form {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .card-form h3 { margin-top: 0; color: var(--primary-color); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .span-1 { grid-column: span 1; }
        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }

        .btn-save {
            background-color: #2b9348;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn-save:hover { opacity: 0.9; }

        /* BUSCADOR Y CONTROLES */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-container {
            flex: 1;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999;
        }
        .print-btn {
            background-color: #495057;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* TARJETAS DE HISTORIAL */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .record-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .record-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        .record-id { font-weight: bold; color: var(--primary-color); background: var(--primary-bg); padding: 3px 8px; border-radius: 12px; }
        
        .record-patient-info {
            display: grid;
            grid-template-columns: 3fr 1fr;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        .info-item span { display: block; font-size: 0.7rem; color: #777; text-transform: uppercase; font-weight: bold; }
        .info-item strong { font-size: 0.95rem; }

        .record-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .detail-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 8px 10px;
        }
        .detail-box label { display: block; font-size: 0.7rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; margin-bottom: 2px; }
        .detail-box p { margin: 0; font-size: 0.9rem; word-break: break-word; white-space: pre-wrap; }

        .record-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .btn-delete { background-color: #d90429; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        .loading { text-align: center; font-weight: bold; color: var(--primary-color); padding: 20px; }

        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr; }
            .span-1, .span-3, .span-4 { grid-column: span 1; }
        }

        @media print {
            body { background: white; padding: 0; }
            #login-screen, .title-bar, .card-form, .controls-row, .refresh-btn, .btn-delete { display: none !important; }
            #dashboard { display: block !important; }
            .record-card { break-inside: avoid; border: 1px solid #ccc; margin-bottom: 15px; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h3 style="text-align: center; color: var(--primary-color); margin: 0 0 10px 0;">C.M.I. "Santa Celia"</h3>
            <p style="text-align: center; color: #666; font-size: 13px; margin-top:0;">Historial Clínico</p>
            
            <div class="form-group">
                <label for="loginUser">Usuario</label>
                <input type="text" id="loginUser" placeholder="Ingrese usuario">
            </div>
            <div class="form-group">
                <label for="loginPin">PIN</label>
                <input type="password" id="loginPin" maxlength="6" placeholder="Ingrese PIN">
            </div>
            <button type="button" class="menu-btn" onclick="verificarLogin()">Ingresar</button>
            <div id="error-box" style="color: #dc3545; font-size: 0.85rem; display: none; text-align: center; font-weight: bold;">Usuario o PIN incorrectos.</div>
        </div>
    </div>

    <!-- PANTALLA DE TRABAJO (DASHBOARD) -->
    <div id="dashboard">
        <div class="title-bar">
            <div class="brand">
                <h1 id="app-title-text">Historial Clínico</h1>
            </div>
            <div class="header-actions">
                <select id="areaSelector" class="area-select-header" onchange="cambiarAreaTrabajo()">
                    <option value="MEDICINA GENERAL">Medicina General</option>
                    <option value="ODONTOLOGIA">Odontología</option>
                    <option value="LABORATORIO">Laboratorio</option>
                </select>
                <button class="action-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO CLÍNICO -->
        <div class="card-form">
            <h3>Nuevo Registro Clínico</h3>
            <form id="formRegistro" onsubmit="enviarDatos(event)">
                <div class="form-grid">
                    <div class="form-group span-1">
                        <label>ID Automático</label>
                        <input type="text" id="idGenerado" readonly>
                    </div>
                    <div class="form-group span-1">
                        <label>Fecha</label>
                        <input type="text" id="fecha" readonly>
                    </div>
                    <div class="form-group span-1">
                        <label>Hora Inicio</label>
                        <input type="time" id="horaInicio" required>
                    </div>
                    <div class="form-group span-1">
                        <label>Hora Final</label>
                        <input type="time" id="horaFinal" required>
                    </div>

                    <div class="form-group span-3">
                        <label>Nombres y Apellidos del Paciente</label>
                        <input type="text" id="nombres" placeholder="Apellidos y Nombres" required>
                    </div>
                    <div class="form-group span-1">
                        <label>DNI</label>
                        <input type="text" id="dni" maxlength="8" placeholder="DNI" required>
                    </div>

                    <div class="form-group span-4">
                        <label>Diagnóstico</label>
                        <input type="text" id="diagnostico" placeholder="Diagnóstico médico" required>
                    </div>
                    <div class="form-group span-4">
                        <label>Medicamentos / Receta</label>
                        <input type="text" id="medicamentos" placeholder="Fármacos prescritos">
                    </div>
                    <div class="form-group span-4">
                        <label>Médico Tratante</label>
                        <input type="text" id="medico" placeholder="Nombre del doctor" required>
                    </div>
                    <div class="form-group span-4">
                        <label>Observaciones</label>
                        <input type="text" id="observaciones" placeholder="Notas adicionales">
                    </div>
                </div>
                <button type="submit" id="btnGuardar" class="btn-save">Subir a la Base de Datos</button>
            </form>
            <div id="msgEstado" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
        </div>

        <!-- BUSCADOR Y CONTROLES -->
        <div class="controls-row">
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" oninput="filtrarTarjetas()" placeholder="Buscar por paciente, DNI, diagnóstico...">
            </div>
            <button class="print-btn" onclick="window.print()">🖨 Imprimir</button>
        </div>
        <button class="refresh-btn" onclick="cargarDatosHistorial()">Actualizar Registros</button>

        <!-- CONTENEDOR DE TARJETAS -->
        <div class="cards-container" id="cardsContainer">
            <div class="loading">Cargando registros...</div>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwM9IydySU4dIsZibHJL3n6ejzrGt1WIdZZ5PfPw_3p1we1YT7KK6QbtIfd9AucXTQx/exec';

    let areaActual = "MEDICINA GENERAL";
    let registrosCache = [];

    function generarIdTemporal() {
        const ahora = new Date();
        const anio = ahora.getFullYear();
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const dia = String(ahora.getDate()).padStart(2, '0');
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const segundos = String(ahora.getSeconds()).padStart(2, '0');
        return `MED-${anio}${mes}${dia}-${horas}${minutos}${segundos}`;
    }

    function inicializarFormulario() {
        const ahora = new Date();
        const d = String(ahora.getDate()).padStart(2, '0');
        const m = String(ahora.getMonth() + 1).padStart(2, '0');
        const y = ahora.getFullYear();
        
        document.getElementById('fecha').value = `${d}/${m}/${y}`;
        document.getElementById('idGenerado').value = generarIdTemporal();
        
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const horaStr = `${horas}:${minutos}`;
        
        document.getElementById('horaInicio').value = horaStr;
        document.getElementById('horaFinal').value = horaStr;
    }

    async function verificarLogin() {
        const usuarioInput = document.getElementById('loginUser').value.trim().toUpperCase();
        const pinInput = document.getElementById('loginPin').value.trim();
        const errorBox = document.getElementById('error-box');
        const btnIngresar = document.querySelector('#login-screen button');

        if (!usuarioInput || !pinInput) {
            alert("Por favor ingrese usuario y PIN.");
            return;
        }

        btnIngresar.innerText = "Verificando...";
        btnIngresar.disabled = true;
        errorBox.style.display = "none";

        try {
            const response = await fetch(scriptURL + "?action=usuarios");
            const usuarios = await response.json();
            
            let encontrado = false;
            usuarios.forEach(u => {
                if (u.usuario.toUpperCase() === usuarioInput && String(u.pin) === String(pinInput)) {
                    encontrado = true;
                }
            });

            if (encontrado) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('areaSelector').value = areaActual;
                document.getElementById('app-title-text').textContent = `Historial Clínico - ${areaActual}`;
                
                inicializarFormulario();
                cargarDatosHistorial();
            } else {
                errorBox.style.display = "block";
            }
        } catch (error) {
            console.error('Error al verificar usuarios:', error);
            errorBox.textContent = "Error de conexión con Google Sheets.";
            errorBox.style.display = "block";
        } finally {
            btnIngresar.innerText = "Ingresar";
            btnIngresar.disabled = false;
        }
    }

    function cerrarSesion() {
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPin').value = '';
        document.getElementById('error-box').style.display = "none";
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
    }

    function cambiarAreaTrabajo() {
        areaActual = document.getElementById('areaSelector').value;
        document.getElementById('app-title-text').textContent = `Historial Clínico - ${areaActual}`;
        cargarDatosHistorial();
    }

    function enviarDatos(event) {
        event.preventDefault();
        const btnGuardar = document.getElementById('btnGuardar');
        const msgEstado = document.getElementById('msgEstado');
        
        btnGuardar.disabled = true;
        btnGuardar.textContent = 'Subiendo...';
        msgEstado.style.color = '#555';
        msgEstado.textContent = 'Guardando registro...';

        const datos = {
            area: areaActual,
            id: document.getElementById('idGenerado').value,
            fecha: document.getElementById('fecha').value,
            horaInicio: document.getElementById('horaInicio').value,
            horaFinal: document.getElementById('horaFinal').value,
            nombres: document.getElementById('nombres').value,
            dni: document.getElementById('dni').value,
            diagnostico: document.getElementById('diagnostico').value,
            medicamentos: document.getElementById('medicamentos').value,
            medico: document.getElementById('medico').value,
            observaciones: document.getElementById('observaciones').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            msgEstado.style.color = 'green';
            msgEstado.textContent = '¡Registro guardado con éxito!';
            document.getElementById('formRegistro').reset();
            inicializarFormulario();
            setTimeout(() => { 
                msgEstado.textContent = ''; 
                cargarDatosHistorial();
            }, 1500);
        })
        .catch(error => {
            console.error('Error:', error);
            msgEstado.style.color = 'red';
            msgEstado.textContent = 'Hubo un error al registrar.';
        })
        .finally(() => {
            btnGuardar.disabled = false;
            btnGuardar.textContent = 'Subir a la Base de Datos';
        });
    }

    function cargarDatosHistorial() {
        const contenedor = document.getElementById('cardsContainer');
        contenedor.innerHTML = '<div class="loading">Cargando registros...</div>';

        fetch(scriptURL + "?action=leer&area=" + encodeURIComponent(areaActual))
        .then(response => response.json())
        .then(data => {
            if (!data || data.length === 0) {
                contenedor.innerHTML = '<div class="loading">No hay registros todavía en esta área.</div>';
                return;
            }

            registrosCache = data.reverse();
            renderizarTarjetas(registrosCache);
        })
        .catch(error => {
            console.error('Error al cargar:', error);
            contenedor.innerHTML = '<div class="loading" style="color: red;">Error al conectar con Google Sheets.</div>';
        });
    }

    function renderizarTarjetas(lista) {
        const contenedor = document.getElementById('cardsContainer');
        contenedor.innerHTML = '';

        lista.forEach((reg) => {
            let card = document.createElement('div');
            card.className = 'record-card';
            card.innerHTML = `
                <div class="record-header">
                    <span class="record-id">${reg.id || '-'}</span>
                    <span>📅 ${reg.fecha || '-'} | ⏰ ${reg.horaInicio || '-'} - ${reg.horaFinal || '-'}</span>
                </div>
                <div class="record-patient-info">
                    <div class="info-item">
                        <span>Paciente</span>
                        <strong>${reg.nombres || '-'}</strong>
                    </div>
                    <div class="info-item">
                        <span>DNI</span>
                        <strong>${reg.dni || '-'}</strong>
                    </div>
                </div>
                <div class="record-details">
                    <div class="detail-box">
                        <label>Diagnóstico</label>
                        <p>${reg.diagnostico || '-'}</p>
                    </div>
                    <div class="detail-box">
                        <label>Medicamentos / Receta</label>
                        <p>${reg.medicamentos || '-'}</p>
                    </div>
                    <div class="detail-box">
                        <label>Observaciones</label>
                        <p>${reg.observaciones || '-'}</p>
                    </div>
                </div>
                <div class="record-footer">
                    <span style="font-size: 0.85rem; font-weight: 600; color: #555;">Dr(a). ${reg.medico || '-'}</span>
                    <button class="btn-delete" onclick="eliminarRegistro('${reg.id}')">Eliminar</button>
                </div>
            `;
            contenedor.appendChild(card);
        });
    }

    function filtrarTarjetas() {
        const filtro = document.getElementById('searchInput').value.toLowerCase();
        const filtrados = registrosCache.filter(reg => {
            let textoFila = Object.values(reg).join(' ').toLowerCase();
            return textoFila.includes(filtro);
        });
        renderizarTarjetas(filtrados);
    }

    function eliminarRegistro(id) {
        if (!confirm(`¿Está seguro de eliminar el registro ID: ${id}?`)) return;

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "eliminar", id: id, area: areaActual })
        })
        .then(() => {
            alert("Registro eliminado con éxito.");
            cargarDatosHistorial();
        })
        .catch(error => {
            console.error('Error al eliminar:', error);
            alert("Error al eliminar el registro.");
        });
    }
</script>

</body>
</html>
