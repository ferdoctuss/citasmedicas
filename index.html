<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Médico Integral Santa Celia - Registro de Citas</title>
    <style>
        :root {
            --primary-color: #0077b6;
            --secondary-color: #0096c7;
            --light-bg: #f8f9fa;
            --border-color: #ced4da;
            --readonly-bg: #e9ecef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Campos no editables en gris */
        input:read-only, select:disabled {
            background-color: var(--readonly-bg);
            color: #495057;
            cursor: not-allowed;
        }

        .service-container {
            display: flex;
            gap: 8px;
        }

        .search-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background-color: var(--secondary-color);
        }

        .service-row {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 10px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #btn-save {
            background-color: #2b9348;
            color: white;
        }

        #btn-print {
            background-color: #495057;
            color: white;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        /* Estilos exclusivos para impresión */
        .print-footer {
            display: none;
            margin-top: 40px;
            border-top: 2px dashed #333;
            padding-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .actions, .search-btn {
                display: none !important;
            }
            input, select, textarea {
                border: none;
                border-bottom: 1px solid #333;
                border-radius: 0;
                padding: 5px 0;
                background: transparent !important;
            }
            .print-footer {
                display: block;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">Centro Médico Integral Santa Celia</h2>
    <div class="subtitle">Sistema de Registro y Agendamiento de Citas</div>

    <form id="appointmentForm">
        <div class="form-grid">
            <!-- ID Automático -->
            <div class="form-group">
                <label for="citaId">ID de Cita (Automático)</label>
                <input type="text" id="citaId" readonly>
            </div>

            <!-- Fecha y Hora Separadas -->
            <div class="form-group">
                <label for="fechaHoraVisual">Fecha y Hora</label>
                <input type="text" id="fechaHoraVisual" readonly>
                <input type="hidden" id="fechaVal">
                <input type="hidden" id="horaVal">
            </div>

            <!-- Área -->
            <div class="form-group full-width">
                <label for="area">Área Médica</label>
                <select id="area" required onchange="actualizarPiePagina()">
                    <option value="" disabled selected>Seleccione un área...</option>
                    <option value="MEDICINA GENERAL">MEDICINA GENERAL</option>
                    <option value="ODONTOLOGIA">ODONTOLOGIA</option>
                    <option value="LABORATORIO">LABORATORIO</option>
                </select>
            </div>

            <!-- Datos del Paciente -->
            <div class="form-group full-width">
                <label for="nombrePaciente">Nombre del Paciente</label>
                <input type="text" id="nombrePaciente" placeholder="Apellidos y Nombres" required>
            </div>

            <div class="form-group">
                <label for="dniPaciente">DNI</label>
                <input type="text" id="dniPaciente" maxlength="8" placeholder="Ingrese DNI" required>
            </div>

            <div class="form-group">
                <label for="edadPaciente">Edad</label>
                <input type="number" id="edadPaciente" placeholder="Edad en años" required>
            </div>

            <!-- Servicio y Tarifario limpio (precio separado en data-precio) -->
            <div class="form-group full-width">
                <label for="servicio">Servicio / Examen (Tarifario)</label>
                <div class="service-row">
                    <div class="service-container">
                        <select id="servicio" required onchange="cargarPrecioAutomatico()">
                            <option value="" disabled selected>Seleccione o busque un servicio...</option>
                            <!-- Tarifario oficial[cite: 2] con nombre limpio y precio en data-precio -->
                            <option value="HEMOGRAMA COMPLETO" data-precio="30">1. HEMOGRAMA COMPLETO</option>
                            <option value="GLUCOSA" data-precio="10">2. GLUCOSA</option>
                            <option value="COLESTEROL" data-precio="10">3. COLESTEROL</option>
                            <option value="TRIGRICELIDOS" data-precio="10">4. TRIGRICELIDOS</option>
                            <option value="UREA" data-precio="10">5. UREA</option>
                            <option value="CREATININA" data-precio="10">6. CREATININA</option>
                            <option value="ACIDO URICO" data-precio="20">7. ACIDO URICO</option>
                            <option value="BILIRRUBINA TOTAL, DIRECTA Y INDIRECTA" data-precio="30">8. BILIRRUBINA TOTAL, DIRECTA Y INDIRECTA</option>
                            <option value="TGO" data-precio="10">9. TGO</option>
                            <option value="TGP" data-precio="10">10. TGP</option>
                            <option value="FOSFATASA ALALINA SIMPLE" data-precio="10">11. FOSFATASA ALALINA SIMPLE</option>
                            <option value="PROTEINAS TOTALES" data-precio="10">12. PROTEINAS TOTALES</option>
                            <option value="ALBUMINA" data-precio="10">13. ALBUMINA</option>
                            <option value="GLOBULINA" data-precio="10">14. GLOBULINA</option>
                            <option value="EXAMEN DE HECES SIMPLE" data-precio="10">15. EXAMEN DE HECES SIMPLE</option>
                            <option value="COPROOLOGICO FUNCIONAL" data-precio="40">16. COPROOLOGICO FUNCIONAL</option>
                            <option value="EXAMEN SERIADO DE HECES" data-precio="20">17. EXAMEN SERIADO DE HECES</option>
                            <option value="TEST DE GRAHAM" data-precio="15">18. TEST DE GRAHAM</option>
                            <option value="REACCION INFLAMATORIA" data-precio="20">19. REACCION INFLAMATORIA</option>
                            <option value="EXAMEN COMPLETO DE HORINA" data-precio="10">20. EXAMEN COMPLETO DE HORINA</option>
                            <option value="UROCULTIVO" data-precio="50">21. UROCULTIVO</option>
                            <option value="DESCARTE DE EMBARAZO ( CUALITATIVO)" data-precio="20">22. DESCARTE DE EMBARAZO ( CUALITATIVO)</option>
                            <option value="DESCARTE DE EMBARAZO ( CUANTITATIVO)" data-precio="50">23. DESCARTE DE EMBARAZO ( CUANTITATIVO)</option>
                            <option value="PCR CUALITATIVO" data-precio="20">24. PCR CUALITATIVO</option>
                            <option value="PCR CUANTITATIVO" data-precio="50">25. PCR CUANTITATIVO</option>
                            <option value="FACTOR REMATOIDEO" data-precio="20">26. FACTOR REMATOIDEO</option>
                            <option value="ACLUTINACIONES" data-precio="20">27. ACLUTINACIONES</option>
                            <option value="HEMOGLOBINA" data-precio="10">28. HEMOGLOBINA</option>
                            <option value="GRUPO Y FACTOR ABO" data-precio="15">29. GRUPO Y FACTOR ABO</option>
                            <option value="PRUEBA DE HELICOBACTER PYLORI" data-precio="30">30. PRUEBA DE HELICOBACTER PYLORI</option>
                            <option value="DUAL VIH SIFILIS" data-precio="50">31. DUAL VIH SIFILIS</option>
                            <option value="DESCARTE DE VIH" data-precio="30">32. DESCARTE DE VIH</option>
                            <option value="DESCRATE DE SIFILIS" data-precio="30">33. DESCRATE DE SIFILIS</option>
                            <option value="HEPATITIS A" data-precio="30">34. HEPATITIS A</option>
                            <option value="HEBATTITIS B" data-precio="30">35. HEBATTITIS B</option>
                            <option value="HEPATITIS C" data-precio="30">36. HEPATITIS C</option>
                            <option value="TP Y IMR" data-precio="30">37. TP Y IMR</option>
                            <option value="TP-IMR-TTPA" data-precio="50">38. TP-IMR-TTPA</option>
                            <option value="HEMOGLOBINA GLICOSILADA" data-precio="50">39. HEMOGLOBINA GLICOSILADA</option>
                            <option value="TOLERANCIA A LA GLUCOSA" data-precio="40">40. TOLERANCIA A LA GLUCOSA</option>
                            <option value="TIEMPO SANGRIA Y TIEMPO DE GOAGULACION" data-precio="10">41. TIEMPO SANGRIA Y TIEMPO DE GOAGULACION</option>
                            <option value="BK ESPUTO" data-precio="20">42. BK ESPUTO</option>
                            <option value="SECRECION VAGINAL" data-precio="20">43. SECRECION VAGINAL</option>
                            <option value="CULTIVO DE SECRECION VAGINAL" data-precio="50">44. CULTIVO DE SECRECION VAGINAL</option>
                            <option value="SECRECION DE GLANDE" data-precio="20">45. SECRECION DE GLANDE</option>
                            <option value="SECRECION DE PIEL" data-precio="20">46. SECRECION DE PIEL</option>
                            <option value="TEST DE HELECHO" data-precio="20">47. TEST DE HELECHO</option>
                            <option value="CERTIFICADO DE SALUBRIDA" data-precio="20">48. CERTIFICADO DE SALUBRIDA</option>
                            <option value="AGA Y ELECTROLITOS" data-precio="120">49. AGA Y ELECTROLITOS</option>
                            <option value="LAMINA PERIFERICA" data-precio="50">50. LAMINA PERIFERICA</option>
                            <option value="GOTA GRUESA Y BARTONELIA" data-precio="20">51. GOTA GRUESA Y BARTONELIA</option>
                        </select>
                        <button type="button" class="search-btn" onclick="buscarServicio()">🔍 Buscar</button>
                    </div>
                    <div>
                        <input type="text" id="precioServicio" placeholder="Costo S/" required>
                    </div>
                </div>
            </div>

            <!-- Observaciones -->
            <div class="form-group full-width">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" rows="3" placeholder="Detalles adicionales de la cita..."></textarea>
            </div>
        </div>

        <!-- Botones de Acción con el texto modificado -->
        <div class="actions">
            <button type="submit" id="btn-save" class="action-btn">Agendar Cita</button>
            <button type="button" id="btn-print" class="action-btn" onclick="window.print()">Imprimir Comprobante</button>
        </div>
    </form>

    <!-- Pie de página para impresión -->
    <div class="print-footer">
        <strong style="font-size: 15px;">CENTRO MÉDICO INTEGRAL SANTA CELIA</strong><br>
        Área: <span id="print-area">--------------------</span><br>
        Dirección: [Actualizar Dirección] | Teléfono: [Actualizar Teléfono]
    </div>
</div>

<script>
    // Generar ID único automático y fecha/hora separada al cargar
    window.onload = function() {
        const randomId = 'SC-' + Math.floor(100000 + Math.random() * 900000);
        document.getElementById('citaId').value = randomId;

        const ahora = new Date();
        const fechaStr = ahora.toLocaleDateString();
        const horaStr = ahora.toLocaleTimeString();

        document.getElementById('fechaHoraVisual').value = fechaStr + ' ' + horaStr;
        document.getElementById('fechaVal').value = fechaStr;
        document.getElementById('horaVal').value = horaStr;
    };

    // Cargar automáticamente el precio en el campo editable al seleccionar un servicio
    function cargarPrecioAutomatico() {
        const select = document.getElementById('servicio');
        const optionSeleccionada = select.options[select.selectedIndex];
        const precio = optionSeleccionada.getAttribute('data-precio');
        if (precio) {
            document.getElementById('precioServicio').value = precio;
        }
    }

    // Función de búsqueda rápida para el tarifario
    function buscarServicio() {
        let termino = prompt("Ingrese el nombre del examen o servicio que desea buscar:");
        if (!termino) return;
        
        termino = termino.toLowerCase();
        let select = document.getElementById('servicio');
        let opciones = select.options;
        let encontrado = false;

        for (let i = 0; i < opciones.length; i++) {
            if (opciones[i].text.toLowerCase().includes(termino)) {
                select.selectedIndex = i;
                encontrado = true;
                cargarPrecioAutomatico();
                break;
            }
        }

        if (!encontrado) {
            alert("No se encontró ningún servicio con ese nombre en el tarifario.");
        }
    }

    // Actualizar el área en el pie de página de impresión
    function actualizarPiePagina() {
        const areaSelect = document.getElementById('area').value;
        document.getElementById('print-area').innerText = areaSelect;
    }

    // URL de tu Apps Script
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxgCP57D_ILxnhZUYE9QdMY3JOcUrCsnsGpjUtIF-ZP4klyV--W-2IC877RxHc9tjcq1Q/exec";

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const datos = {
            id: document.getElementById('citaId').value,
            fecha: document.getElementById('fechaVal').value,
            hora: document.getElementById('horaVal').value,
            area: document.getElementById('area').value,
            paciente: document.getElementById('nombrePaciente').value,
            edad: document.getElementById('edadPaciente').value,
            dni: document.getElementById('dniPaciente').value,
            servicio: document.getElementById('servicio').value,
            costo: document.getElementById('precioServicio').value,
            observaciones: document.getElementById('observaciones').value
        };

        const btnSave = document.getElementById('btn-save');
        btnSave.innerText = "Agendando...";
        btnSave.disabled = true;

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            alert("¡Cita agendada y registrada en Google Sheets con éxito!");
            document.getElementById('appointmentForm').reset();
            location.reload();
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un error al registrar la cita.");
            btnSave.innerText = "Agendar Cita";
            btnSave.disabled = false;
        });
    });
</script>

</body>
</html>
